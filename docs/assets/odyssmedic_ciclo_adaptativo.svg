<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="100%" role="img" aria-label="Flujo Adaptativo de OdyssMedic">
  <defs>
    <style>
      .bg { fill: #FDFCFA; }
      .frame { fill: #FFFFFF; stroke: #DCE5E3; stroke-width: 1.5; }
      .eyebrow { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.2px; fill: #0E6F65; }
      .heading { font-family: 'Georgia', 'Playfair Display', serif; font-size: 23px; font-weight: 700; fill: #0B252E; }
      .sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 12.5px; fill: #4A5D64; }
      .card-title { font-family: 'Georgia', 'Playfair Display', serif; font-size: 15px; font-weight: 700; fill: #0B252E; }
      .card-body { font-family: 'Inter', -apple-system, sans-serif; font-size: 11.5px; fill: #4A5D64; }
      .step-num { font-family: 'Georgia', serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
      .connector { stroke: #CFE2DE; stroke-width: 2.5; stroke-dasharray: 6 6; fill: none; }
      .pulse-line {
        stroke: #0E6F65;
        stroke-width: 3;
        stroke-linecap: round;
        fill: none;
        stroke-dasharray: 90 920;
        animation: travelPulse 6.5s linear infinite;
      }
      .node-1 { animation: highlightCard 6.5s ease-in-out infinite 0s; }
      .node-2 { animation: highlightCard 6.5s ease-in-out infinite 1.3s; }
      .node-3 { animation: highlightCard 6.5s ease-in-out infinite 2.6s; }
      .node-4 { animation: highlightCard 6.5s ease-in-out infinite 3.9s; }
      .node-5 { animation: highlightCard 6.5s ease-in-out infinite 5.2s; }

      @keyframes travelPulse {
        0% { stroke-dashoffset: 1010; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes highlightCard {
        0%, 24%, 100% { stroke: #DCE5E3; stroke-width: 1.5; transform: translateY(0px); }
        10% { stroke: #0E6F65; stroke-width: 2.4; transform: translateY(-3px); }
      }
    </style>
  </defs>

  <rect width="1120" height="340" rx="24" class="bg" />
  <rect x="8" y="8" width="1104" height="324" rx="20" class="frame" />

  <!-- Header -->
  <text x="44" y="46" class="eyebrow">ARQUITECTURA PEDAGOGICA Y CLINICA EN TIEMPO REAL</text>
  <text x="44" y="76" class="heading">Ciclo Cerrado de Entrenamiento Adaptativo OdyssMedic</text>
  <text x="44" y="99" class="sub">Calibracion diagnostica obligatoria, deteccion de brechas cognitivas (OCRI), perlas basadas en guias y proyeccion longitudinal D7 / D21.</text>

  <!-- Connecting Track -->
  <path d="M 130 212 L 990 212" class="connector" />
  <path d="M 130 212 L 990 212" class="pulse-line" />

  <!-- Stage 1 -->
  <g transform="translate(36, 130)">
    <rect width="192" height="168" rx="18" fill="#F7FAF9" class="node-1" />
    <circle cx="28" cy="28" r="13" fill="#0E6F65" />
    <text x="28" y="32" text-anchor="middle" class="step-num">1</text>
    <text x="50" y="33" class="eyebrow" style="font-size:10px;">CALIBRACION</text>
    <text x="18" y="64" class="card-title">Evaluacion Inicial</text>
    <text x="18" y="88" class="card-body">Modalidad General o</text>
    <text x="18" y="105" class="card-body">por Especialidad unica.</text>
    <text x="18" y="128" class="card-body" style="fill:#0E6F65;font-weight:600;">Define aptitud real</text>
    <text x="18" y="145" class="card-body" style="fill:#0E6F65;font-weight:600;">antes de abrir ruta.</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(248, 130)">
    <rect width="192" height="168" rx="18" fill="#FFF9F9" class="node-2" />
    <circle cx="28" cy="28" r="13" fill="#B6222A" />
    <text x="28" y="32" text-anchor="middle" class="step-num">2</text>
    <text x="50" y="33" class="eyebrow" style="font-size:10px;fill:#B6222A;">DIAGNOSTICO OCRI</text>
    <text x="18" y="64" class="card-title">Brechas y Rombo</text>
    <text x="18" y="88" class="card-body">Clasifica errores en 4 ejes:</text>
    <text x="18" y="105" class="card-body">Triaje, Diagnostico, Lab</text>
    <text x="18" y="122" class="card-body">y Manejo Inicial.</text>
    <text x="18" y="145" class="card-body" style="fill:#B6222A;font-weight:600;">Rojo en bajas notas.</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(460, 130)">
    <rect width="192" height="168" rx="18" fill="#FDF7E7" class="node-3" />
    <circle cx="28" cy="28" r="13" fill="#9A6B1F" />
    <text x="28" y="32" text-anchor="middle" class="step-num">3</text>
    <text x="50" y="33" class="eyebrow" style="font-size:10px;fill:#9A6B1F;">SIMULADOR 3 PASOS</text>
    <text x="18" y="64" class="card-title">Casos Reales BMC</text>
    <text x="18" y="88" class="card-body">Vinetas sanitizadas con</text>
    <text x="18" y="105" class="card-body">signos vitales, examen</text>
    <text x="18" y="122" class="card-body">fisico y laboratorios.</text>
    <text x="18" y="145" class="card-body" style="fill:#9A6B1F;font-weight:600;">Feedback animado.</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(672, 130)">
    <rect width="192" height="168" rx="18" fill="#F7FAF9" class="node-4" />
    <circle cx="28" cy="28" r="13" fill="#0E6F65" />
    <text x="28" y="32" text-anchor="middle" class="step-num">4</text>
    <text x="50" y="33" class="eyebrow" style="font-size:10px;">EVIDENCIA CLINICA</text>
    <text x="18" y="64" class="card-title">Perla y Biblioteca</text>
    <text x="18" y="88" class="card-body">27 guias y tratados</text>
    <text x="18" y="105" class="card-body">(KDIGO, ADA, AHA, ESC)</text>
    <text x="18" y="122" class="card-body">con fichas semiologicas.</text>
    <text x="18" y="145" class="card-body" style="fill:#0E6F65;font-weight:600;">Lectura abierta.</text>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(884, 130)">
    <rect width="200" height="168" rx="18" fill="#ECF6F4" class="node-5" />
    <circle cx="28" cy="28" r="13" fill="#0D4A44" />
    <text x="28" y="32" text-anchor="middle" class="step-num">5</text>
    <text x="50" y="33" class="eyebrow" style="font-size:10px;fill:#0D4A44;">LONGITUDINAL</text>
    <text x="18" y="64" class="card-title">Simulador D7 / D21</text>
    <text x="18" y="88" class="card-body">Adelanta +1, +7 o +21 dias</text>
    <text x="18" y="105" class="card-body">en vivo o simula olvido</text>
    <text x="18" y="122" class="card-body">de Ebbinghaus.</text>
    <text x="18" y="145" class="card-body" style="fill:#0D4A44;font-weight:600;">Adaptacion instantanea.</text>
  </g>
</svg>
